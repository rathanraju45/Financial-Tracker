html{height:100%;scroll-padding-top:12px}*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#bdbdbd transparent}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c5c5c5;border:3px solid transparent;background-clip:padding-box;border-radius:10px}::-webkit-scrollbar-thumb:hover{background:#929292;border:3px solid transparent;background-clip:padding-box}body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}#app{display:flex;height:100%;min-height:0}aside{width:224px;flex:none;background:var(--side);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}aside h1{font-size:15px;margin:2px 10px 16px;font-weight:700;letter-spacing:-.25px;color:var(--tx)}.nav{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--mu);border:0;background:none;font:inherit;text-align:left;width:100%;transition:background .16s ease,color .16s ease}.nav b{width:19px;text-align:center;color:inherit;font-size:14px}.nav:hover{background:var(--sel);color:var(--tx)}.nav.on{background:var(--sel);color:var(--tx);font-weight:650;box-shadow:inset 0 0 0 1px var(--ln),0 2px 6px rgba(0,0,0,.045)}.sp{flex:1}.foot{color:var(--mu);font-size:11px;padding:0 10px;line-height:1.55}main{flex:1;overflow:auto;overscroll-behavior:contain;padding:26px 30px 44px;min-width:0;scrollbar-gutter:stable} .top{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap}.top h2{font-size:23px;margin:0;letter-spacing:-.55px;font-weight:680;flex:1}.b,button.b{background:var(--card);border:1px solid var(--ln);border-radius:9px;padding:7px 13px;min-height:34px;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease}.b:hover{background:var(--sel);border-color:#d2d2d2;box-shadow:0 4px 10px rgba(0,0,0,.08)}.b:active{filter:brightness(.96)}.b.p{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.12)}.b.p:hover{filter:brightness(.88);box-shadow:0 3px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.17)}.b.d{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 30%,var(--ln))}.b.d:hover{background:color-mix(in srgb,var(--neg) 8%,var(--card))}button:disabled{opacity:.45;cursor:not-allowed}button.b,select,input,textarea{font:inherit;color:var(--tx)}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}input,select,textarea{background:var(--card);border:1px solid var(--ln);border-radius:9px;padding:7px 10px;width:100%;transition:border-color .15s ease,box-shadow .15s ease}input:hover,select:hover,textarea:hover{border-color:#c5c5c5}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 9%,transparent);outline:0}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}.card{position:relative;background:linear-gradient(150deg,color-mix(in srgb,var(--card) 96%,white),var(--card) 68%);border:1px solid var(--ln);border-radius:16px;padding:17px;min-width:0;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.42);transform:perspective(1200px) translateZ(0);transform-style:preserve-3d;transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease,border-color .24s ease;will-change:transform}.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent 38%);opacity:.55}.card:hover{box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--ln) 60%,var(--tx));z-index:2}.card:active{box-shadow:var(--shadow)}.card h3{margin:0 0 11px;font-size:12px;color:var(--mu);font-weight:650;letter-spacing:.015em}.big{font-size:26px;font-weight:700;letter-spacing:-.65px;line-height:1.2}.hero{font-size:38px}.pos{color:var(--pos)}.neg{color:var(--neg)}.mu{color:var(--mu)}table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--mu);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--card);z-index:1}td{padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tr:hover td{background:color-mix(in srgb,var(--sel) 65%,var(--card))}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow:auto;overscroll-behavior:contain}.bar{height:7px;background:var(--ln);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0}.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sel);color:var(--tx);font-weight:550}dialog{border:1px solid var(--ln);border-radius:16px;background:var(--card);color:var(--tx);padding:22px;width:min(460px,94vw);max-height:88vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}dialog.wide{width:min(780px,96vw)}dialog h3{margin:0 0 14px;font-size:16px;letter-spacing:-.2px}.f{display:grid;grid-template-columns:1fr 1fr;gap:11px}.f label{display:block;color:var(--mu);font-size:11px;margin-bottom:4px;font-weight:550}.f .w{grid-column:1/-1}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#181818;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:10}#toast.on{opacity:1}.empty{padding:34px 20px;text-align:center;color:var(--mu)}.bar-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar-ctl select,.bar-ctl input{width:auto}.seg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden;background:var(--card)}.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:inherit;color:var(--mu)}.seg button:hover{background:var(--sel);color:var(--tx)}.seg button.on{background:var(--ac);color:var(--bg)}.pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.lg{flex:1;min-width:190px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}.card.scroll{max-width:100%}.card.scroll:hover{transform:none}svg{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}.card:hover,.card:active,.b:hover,.b:active{transform:none!important}}@media(max-width:700px){aside{width:64px;padding:14px 7px}.nav{justify-content:center;padding:9px 7px}.nav span,aside h1,.foot{display:none}.nav b{width:auto}main{padding:17px 14px 30px;scrollbar-gutter:auto}.top{gap:7px}.top h2{font-size:21px}.g2{grid-template-columns:1fr}.card{padding:14px}.hero{font-size:33px}.bar-ctl select,.bar-ctl input{max-width:100%}.f{gap:9px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script></head><body>
<div id="app"><aside>
<h1>Ledger</h1><div id="nav"></div><div class="sp"></div>
<div class="foot" id="fstat"></div></aside>
<main id="main"></main></div>
<dialog id="dlg"></dialog><dialog id="cf"></dialog><dialog id="sc" class="wide"></dialog><input type="file" id="pick" accept=".json,application/json" hidden><div id="toast"></div>
<script>
const SCHEMA=3;
const TYPES={bank:'Bank account',cash:'Cash',card:'Credit card',loan:'Loan',invest:'Investment'};
const LIAB=t=>t==='card'||t==='loan';
const EXP=['Housing','Food','Transport','Utilities','Health','Shopping','Entertainment','Education','Insurance','Travel','Interest & fees','Other'];
const INC=['Salary','Business','Investment','Gift','Refund','Other income'];
let S=fresh(),view='dash',flt={q:'',acc:'',type:'',from:'',to:'',sort:'date-desc'},rep={months:12};
function migrate(d){if(!d||typeof d!=='object'||!Array.isArray(d.accounts||[])||!Array.isArray(d.tx||d.transactions||[]))throw new SyntaxError('bad');
 if(!d.v||d.v<2)d={v:2,accounts:(d.accounts||[]).map(a=>({...a,type:a.type||'bank'})),tx:d.tx||d.transactions||[]};
 d.accounts=d.accounts||[];d.tx=d.tx||[];
 d.accounts.forEach(a=>{if(a.type==='loan'&&!a.loan)a.loan={kind:'Other',lender:'',principal:-a.open,rate:+a.rate||0,months:0,first:'',emi:+a.emi||0,paidBefore:0}});
 d.settings={cur:'INR'};d.v=SCHEMA;return d}
function fresh(){return{v:SCHEMA,app:'ledger',settings:{cur:'INR'},accounts:[],tx:[]}}
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const INR=[0,1].map(z=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:z?0:2})),money=(n,c)=>INR[c?1:0].format(n),lk=n=>{const a=Math.abs(n),g=n<0?'−':'';return a>=1e7?g+'₹'+(a/1e7).toFixed(2)+' Cr':a>=1e5?g+'₹'+(a/1e5).toFixed(2)+' L':g+money(a,1)};
const cls=n=>n<0?'neg':n>0?'pos':'';
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2200)}
function ask(msg,label,fn){const c=$('#cf');c.innerHTML=`<h3>${esc(msg)}</h3><div class="acts"><button class="b" id="c_no">Cancel</button><button class="b p" id="c_yes">${esc(label)}</button></div>`;$('#c_no').onclick=()=>c.close();$('#c_yes').onclick=()=>{c.close();fn()};c.showModal()}
const acc=id=>S.accounts.find(a=>a.id===id);
function delta(t,id){if(t.type==='income'&&t.acc===id)return t.amt;if(t.type==='expense'&&t.acc===id)return-t.amt;
 if(t.type==='transfer'){if(t.acc===id)return-t.amt;if(t.to===id)return t.amt}return 0}
function balance(a,upTo){return a.open+S.tx.reduce((s,t)=>(!upTo||t.date<=upTo)?s+delta(t,a.id):s,0)}
function totals(upTo){let as=0,li=0;S.accounts.forEach(a=>{const b=balance(a,upTo);LIAB(a.type)?li+=b:as+=b});return{as,li,nw:as+li}}
const month=d=>d.slice(0,7);
function monthsList(n){const r=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);r.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}return r}
function mEnd(m){const[y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10)}
function flow(m){let i=0,e=0;S.tx.forEach(t=>{if(month(t.date)!==m)return;if(t.type==='income')i+=t.amt;if(t.type==='expense')e+=t.amt});return{i,e}}
function catSpend(from,to){const c={};S.tx.forEach(t=>{if(t.type==='expense'&&t.date>=from&&t.date<=to)c[t.cat||'Other']=(c[t.cat||'Other']||0)+t.amt});return Object.entries(c).sort((a,b)=>b[1]-a[1])}

const NAV=[['dash','◉','Dashboard'],['tx','⇄','Transactions'],['acc','▤','Accounts'],['loans','₹','Loans'],['rep','▦','Reports'],['data','⇅','Import & Backup']];
function nav(){stat();$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="nav ${view===k?'on':''}" data-v="${k}"><b>${i}</b><span>${l}</span></button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render()}};
function render(){nav();if(!ready&&view!=='data')return welcome();({dash,tx:txView,acc:accView,loans:loanView,rep:repView,data:dataView})[view]()}

/* Dashboard */
function lineChart(pts,w=640,h=190){if(pts.length<2)return'<div class="empty">Add transactions to see your net worth trend.</div>';
 const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),r=(mx-mn)||1,px=i=>10+i*(w-20)/(pts.length-1),py=v=>h-24-(v-mn)/r*(h-44);
 const path=pts.map((p,i)=>(i?'L':'M')+px(i).toFixed(1)+','+py(p.v).toFixed(1)).join('');
 return`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Net worth over time"><path d="${path}L${px(pts.length-1)},${h-24}L10,${h-24}Z" fill="var(--sel)"/><path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>
 <text x="10" y="${h-6}" font-size="10" fill="var(--mu)">${pts[0].m}</text><text x="${w-10}" y="${h-6}" font-size="10" text-anchor="end" fill="var(--mu)">${pts.at(-1).m}</text>
 <text x="10" y="12" font-size="10" fill="var(--mu)">${money(mx,1)}</text></svg>`}
/* Data file (no browser storage): File System Access API with download/upload fallback */
let FH=null,fname='',origin='',ready=false,dirty=false,tmr,pending=null,booting=!!window.showOpenFilePicker;
let driveMode=false,driveFileId='',driveToken='',driveTokenUntil=0,driveKey=null,driveSalt=null,driveSaveTimer=null,driveBusy=false;
let driveKeyDbPromise=null;
function prefGet(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function prefSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
driveFileId=prefGet('ledger_drive_file_id');
function driveKeyDb(){if(!driveKeyDbPromise)driveKeyDbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('ledger-remembered-key',1);r.onupgradeneeded=()=>r.result.createObjectStore('keys');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return driveKeyDbPromise}
async function rememberedKeyGet(){const d=await driveKeyDb();return new Promise(resolve=>{const q=d.transaction('keys').objectStore('keys').get('drive');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>resolve(null)})}
async function rememberedKeyPut(value){const d=await driveKeyDb();return new Promise(resolve=>{const tx=d.transaction('keys','readwrite'),store=tx.objectStore('keys');value?store.put(value,'drive'):store.delete('drive');tx.oncomplete=()=>resolve();tx.onerror=()=>resolve()})}
async function cacheDriveKey(){if(prefGet('ledger_remember_drive_key')==='1'&&driveKey&&driveFileId){try{await rememberedKeyPut({fileId:driveFileId,key:driveKey})}catch(e){toast('This browser cannot remember the encryption key')}}else try{await rememberedKeyPut(null)}catch(e){}}
const DRIVE_NAME='Ledger encrypted data.json',DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const PICK={types:[{description:'Ledger data file',accept:{'application/json':['.json']}}]};
function setData(d,name,org){driveMode=false;driveKey=null;driveSalt=null;prefSet('ledger_drive_preferred','0');S=migrate(d);fname=name;origin=org;ready=true;dirty=false;view='dash';render()}
function save(){dirty=true;if(driveMode){clearTimeout(driveSaveTimer);driveSaveTimer=setTimeout(writeDrive,700)}else if(FH){clearTimeout(tmr);tmr=setTimeout(writeFile,400)}stat()}
async function writeFile(){if(!FH)return;try{const w=await FH.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();dirty=false;stat()}catch(e){toast('Couldn’t write to the file – check permissions or use Save a copy')}}
async function openFile(){if(window.showOpenFilePicker){try{const[h]=await showOpenFilePicker(PICK);const f=await h.getFile(),d=JSON.parse(await f.text());try{await h.requestPermission({mode:'readwrite'})}catch(e){}const m=migrate(d);FH=h;remember();return setData(m,f.name,'file')}catch(e){if(e.name==='AbortError')return;if(e instanceof SyntaxError||e.message==='bad')return toast('That file isn’t a valid Ledger data file')}}
 $('#pick').click()}
async function newFile(){const mk=()=>{S=fresh()};if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:'ledger-data.json',...PICK});FH=h;mk();remember();await writeFile();return setData(S,h.name,'file')}catch(e){if(e.name==='AbortError')return}}
 FH=null;mk();setData(S,'ledger-data.json','new');dirty=true;stat();toast('New data file – press Save to download it')}
async function saveFile(){if(!ready)return;if(driveMode){await writeDrive();return}if(FH){await writeFile();return toast('Saved to '+fname)}
 if(window.showSaveFilePicker){try{FH=await showSaveFilePicker({suggestedName:fname||'ledger-data.json',...PICK});fname=FH.name;remember();await writeFile();return toast('Saved to '+fname)}catch(e){FH=null;if(e.name==='AbortError')return}}
 dl(fname&&/\.json$/.test(fname)?fname:'ledger-data.json',JSON.stringify(S,null,1),'application/json');dirty=false;origin='file';stat();toast('Downloaded – keep this file safe and open it next time')}
/* Remember the chosen file location (only the file handle is kept in the browser, never your data) */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ledger-file',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async()=>{const d=await idb();return new Promise(res=>{const q=d.transaction('h').objectStore('h').get('handle');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})};
const idbPut=async v=>{const d=await idb();return new Promise(res=>{const t=d.transaction('h','readwrite');v?t.objectStore('h').put(v,'handle'):t.objectStore('h').delete('handle');t.oncomplete=()=>res();t.onerror=()=>res()})};
const remember=()=>{if(FH)idbPut(FH).catch(()=>{})};
async function loadHandle(h){try{const f=await h.getFile(),m=migrate(JSON.parse(await f.text()));FH=h;pending=null;remember();setData(m,f.name,'file')}catch(e){if(e.name==='NotFoundError'){idbPut(null);pending=null;toast('Your data file was moved or deleted – choose it again')}else toast('Couldn’t open '+h.name+' – is it a Ledger data file?');render()}}
async function reconnect(){const h=pending;if(!h)return;try{if(await h.requestPermission({mode:'readwrite'})!=='granted')return toast('Allow access to open '+h.name)}catch(e){}await loadHandle(h)}
async function init(){try{if(prefGet('ledger_drive_preferred')!=='1'&&window.showOpenFilePicker){const h=await idbGet();if(h){if(await h.queryPermission({mode:'readwrite'})==='granted')await loadHandle(h);else pending=h}}}catch(e){}booting=false;if(!ready)render()}
async function saveAs(){if(driveMode)return toast('Your data is stored encrypted in Google Drive. Download an encrypted backup from Import & Backup.');if(!window.showSaveFilePicker)return saveFile();try{const h=await showSaveFilePicker({suggestedName:fname||'ledger-data.json',...PICK});FH=h;fname=h.name;origin='file';remember();await writeFile();render();toast('Data now saved to '+fname)}catch(e){if(e.name!=='AbortError')toast('Couldn’t use that location')}}
function forgetFile(){idbPut(null);pending=null;FH=null;origin='new';dirty=true;stat();render();toast('Location forgotten – you’ll choose a file next time')}
function stat(){const e=$('#fstat');if(!e)return;e.innerHTML=ready?`<b>${esc(fname)}</b><br>${driveMode?(dirty?'Saving encrypted to Google Drive…':'Encrypted in Google Drive'):FH?(dirty?'Saving…':'All changes saved to file'):(dirty||origin!=='file')?'Not saved yet':'Opened from file'}<br><button class="b" style="margin-top:6px;padding:2px 8px" onclick="saveFile()">${driveMode||FH?'Save now':'Save…'}</button>`:'No data file open'}
function welcome(){if(booting){$('#main').innerHTML='<div class="card empty" style="max-width:560px;margin:8vh auto 0">Opening your data file…</div>';return}$('#main').innerHTML=`<div class="card" style="max-width:560px;margin:8vh auto 0;padding:28px"><h2 style="margin:0 0 8px;font-size:24px">Open your Ledger</h2>

 intr=mine.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amt,0),pre=S.tx.filter(t=>t.loan===a.id&&t.pre).reduce((s,t)=>s+t.amt,0),

 return{L,O,paid,intr,pre,emi,n,next,end:next&&O>0&&isFinite(n)?addM(next,n-1):'',pr:L.principal?Math.max(0,Math.min(100,(1-O/L.principal)*100)):0}}

 for(let k=0;k<count&&O>0;k++){const d=addM(i.L.first,i.paid+k);if(onlyDue&&d>today())break;const it=Math.round(O*i.L.rate/1200),pr=Math.min(Math.max(i.emi-it,0),O);if(pr<=0)break;

const b64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveDriveKey(pass,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptWithDriveKey(data,key,salt){if(!crypto?.subtle)throw Error('Secure encryption requires HTTPS or localhost.');const iv=crypto.getRandomValues(new Uint8Array(12)),plain=new TextEncoder().encode(JSON.stringify(data)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return{app:'ledger-encrypted',version:1,kdf:'PBKDF2-SHA-256',iterations:600000,salt:b64(salt),iv:b64(iv),ciphertext:b64(cipher)}}
async function encryptDriveData(data,pass){if(!crypto?.subtle)throw Error('Secure encryption requires HTTPS or localhost.');const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveDriveKey(pass,salt);return{envelope:await encryptWithDriveKey(data,key,salt),key,salt}}
async function decryptDriveData(env,pass){if(env?.app!=='ledger-encrypted'||env.version!==1)throw Error('This is not a supported encrypted Ledger file.');const key=await deriveDriveKey(pass,un64(env.salt));try{const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(env.iv)},key,un64(env.ciphertext));return{data:JSON.parse(new TextDecoder().decode(plain)),key}}catch(e){throw Error('Wrong passphrase or damaged encrypted file.')}}
function saveDriveClient(){const v=$('#driveClientId')?.value.trim();if(!v)return toast('Enter your Google OAuth client ID first');prefSet('ledger_google_client_id',v);toast('Google client ID saved in this browser')}
function driveStatus(msg){const e=$('#driveStatus');if(e)e.textContent=msg}
function connectDrive(){if(location.protocol==='file:'){const m='Google sign-in cannot run from a file:// page. Open Ledger at http://localhost or HTTPS, then register that exact origin in Google Cloud.';driveStatus(m);return toast('Open Ledger from localhost or HTTPS to connect Google Drive')}const clientId=$('#driveClientId')?.value.trim()||prefGet('ledger_google_client_id')||'';if(!clientId){driveStatus('Enter the Web application OAuth client ID from Google Cloud.');return toast('Add your Google OAuth client ID first')}prefSet('ledger_google_client_id',clientId);if(!window.google?.accounts?.oauth2){driveStatus('Google sign-in is still loading. Wait a moment and try again.');return toast('Google sign-in is still loading. Try again in a moment.')}
 driveStatus('Opening Google sign-in… check whether a popup window appeared.');try{const client=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:DRIVE_SCOPE,callback:r=>{if(r.error){driveToken='';const why=r.error_description||r.error;if(prefGet('ledger_google_authorized')==='1'){prefSet('ledger_google_authorized','0');driveStatus('Google needs you to choose your account again. Click Connect Google Drive once more.')}else driveStatus('Google sign-in failed: '+why+'. Check the OAuth origin '+location.origin);return toast('Google Drive connection needs another click')}driveToken=r.access_token;driveTokenUntil=Date.now()+(Number(r.expires_in||3600)-60)*1000;prefSet('ledger_google_authorized','1');driveStatus('Google Drive connected.');toast('Google Drive connected');if(prefGet('ledger_drive_preferred')==='1'&&prefGet('ledger_remember_drive_key')==='1')autoLoadRememberedDrive()},error_callback:e=>{driveStatus('The Google sign-in popup was blocked or closed. Allow popups for this site, then retry.');toast('Google sign-in popup was blocked or closed')}});client.requestAccessToken({prompt:prefGet('ledger_google_authorized')==='1'?'':'select_account'})}catch(e){driveStatus('Could not start Google sign-in. Check the OAuth client ID and allowlisted origin: '+location.origin);toast('Google sign-in setup needs attention')}}
async function driveFetch(url,opts={}){if(!driveToken||Date.now()>driveTokenUntil)throw Error('Reconnect Google Drive, then try again.');const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+driveToken}});if(!r.ok){const body=await r.text();if(r.status===401)driveToken='';throw Error('Google Drive returned '+r.status+(body?': '+body.slice(0,180):''))}return r}
async function findDriveFile(){if(driveFileId){try{const check=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(driveFileId)+'?fields=id,name,trashed,size');const meta=await check.json();if(meta.id&&!meta.trashed)return driveFileId}catch(e){if(!String(e.message).includes('Google Drive returned 404'))throw e}driveFileId='';prefSet('ledger_drive_file_id','');await rememberedKeyPut(null)}const q=encodeURIComponent("name='"+DRIVE_NAME+"' and trashed=false");const r=await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&fields=files(id,name,modifiedTime,size)&pageSize=10');const d=await r.json();if(d.files?.length){driveFileId=d.files[0].id;prefSet('ledger_drive_file_id',driveFileId);return driveFileId}return''}
async function forgetDriveFileLink(){driveFileId='';prefSet('ledger_drive_file_id','');await rememberedKeyPut(null);driveKey=null;driveSalt=null;driveMode=false;prefSet('ledger_drive_preferred','0');driveStatus('Saved Drive link cleared from this browser. Reconnect and search again. No Drive files were deleted.');toast('Drive link cleared from this browser; your Google Drive files are unchanged')}
async function openDriveFile(){try{const id=await findDriveFile();if(!id)return toast('No Ledger file was found in this Google account.');const meta=await(await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?fields=id,name,size,webViewLink,modifiedTime')).json();driveStatus(`${meta.name||DRIVE_NAME} · ${Number(meta.size||0)} bytes · ${meta.modifiedTime||'date unavailable'}`);window.open(meta.webViewLink||'https://drive.google.com/drive/my-drive','_blank','noopener')}catch(e){driveStatus('Could not locate the Drive file: '+e.message);toast(e.message)}}
function drivePass(){const p=$('#drivePass')?.value||'';if(p.length<12){toast('Use an encryption passphrase at least 12 characters long');return''}return p}
async function loadDriveData(){try{const pass=drivePass();if(!pass)return;const id=await findDriveFile();if(!id)return toast('No Ledger Drive file found yet. Create one from your current data.');const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media');const env=await r.json(),opened=await decryptDriveData(env,pass);S=migrate(opened.data);driveKey=opened.key;driveSalt=un64(env.salt);driveMode=true;prefSet('ledger_drive_preferred','1');await cacheDriveKey();FH=null;fname=DRIVE_NAME;origin='drive';ready=true;dirty=false;idbPut(null);view='dash';render();toast('Encrypted Drive data loaded')}catch(e){driveStatus('Could not load data. Check the passphrase and Drive access.');toast(e.message.includes('decrypt')?'Wrong passphrase or damaged encrypted file':e.message)}}
async function createDriveData(){try{if(!ready)return toast('Open your existing data before making a Drive copy');const pass=drivePass();if(!pass)return;const encrypted=await encryptDriveData(S,pass);let id=await findDriveFile(),r;if(id){const meta=await(await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?fields=id,name,size,webViewLink')).json();if(Number(meta.size||0)>0)return toast('A non-empty Ledger Drive file already exists. Load it first; your current data was not uploaded.');driveStatus('Found an empty Ledger Drive file. Filling it with your current data…')}else{r=await driveFetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_NAME,mimeType:'application/json'})});const f=await r.json();id=f.id;if(!id)throw Error('Google Drive did not return a file ID.');driveFileId=id;prefSet('ledger_drive_file_id',id)}r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(id)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(encrypted.envelope)});driveFileId=id;prefSet('ledger_drive_file_id',id);driveKey=encrypted.key;driveSalt=encrypted.salt;driveMode=true;prefSet('ledger_drive_preferred','1');await cacheDriveKey();FH=null;fname=DRIVE_NAME;origin='drive';dirty=false;idbPut(null);stat();render();toast('Encrypted data saved to Google Drive')}catch(e){driveStatus('Could not create or repair the encrypted file.');toast(e.message)}}
async function writeDrive(){if(!driveMode||!driveFileId||!driveKey)return;if(driveBusy){clearTimeout(driveSaveTimer);driveSaveTimer=setTimeout(writeDrive,700);return}if(!driveToken||Date.now()>driveTokenUntil){driveStatus('Reconnect Google Drive to save pending changes.');toast('Changes are waiting. Reconnect Google Drive to save them.');return}driveBusy=true;const snapshot=JSON.stringify(S);try{const encrypted=await encryptWithDriveKey(JSON.parse(snapshot),driveKey,driveSalt);const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(driveFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(encrypted.envelope)});if(JSON.stringify(S)===snapshot){dirty=false;driveStatus('Encrypted data saved to Google Drive');stat()}else{clearTimeout(driveSaveTimer);driveSaveTimer=setTimeout(writeDrive,300)}}catch(e){driveStatus('Save failed. Reconnect Google Drive and save again.');toast('Could not save encrypted data: '+e.message)}finally{driveBusy=false}}
async function autoLoadRememberedDrive(){if(prefGet('ledger_drive_preferred')!=='1'||prefGet('ledger_remember_drive_key')!=='1'||!driveFileId)return;try{const saved=await rememberedKeyGet();if(!saved||saved.fileId!==driveFileId){driveStatus('Drive connected. Enter your passphrase once, then enable Remember this device to auto-load next time.');return}driveStatus('Reopening your encrypted Drive file…');const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(driveFileId)+'?alt=media'),env=await r.json();let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(env.iv)},saved.key,un64(env.ciphertext))}catch(e){await rememberedKeyPut(null);driveStatus('Saved device key no longer works. Enter your passphrase to unlock the Drive file.');return}S=migrate(JSON.parse(new TextDecoder().decode(plain)));driveKey=saved.key;driveSalt=un64(env.salt);driveMode=true;FH=null;fname=DRIVE_NAME;origin='drive';ready=true;dirty=false;view='dash';render();toast('Drive data reopened on this device')}catch(e){driveStatus('Connected, but automatic loading failed: '+e.message)}}
async function saveEncryptedCopy(){try{let env;if(driveMode){if(!driveKey||!driveSalt)return toast('Unlock your Google Drive file first');env=await encryptWithDriveKey(S,driveKey,driveSalt)}else{const pass=drivePass();if(!pass)return;env=(await encryptDriveData(S,pass)).envelope}dl('ledger-encrypted-backup-'+today()+'.json',JSON.stringify(env,null,1),'application/json');toast('Encrypted backup downloaded')}catch(e){toast(e.message)}}
/* Import / Export / Backup */
const H=['date','type','amount','account','to_account','category','payee','note'];
function csvOut(filtered_){const rows=(filtered_?S.tx:S.tx).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.amt,acc(t.acc)?.name||'',t.type==='transfer'?acc(t.to)?.name||'':'',t.cat,t.payee,t.note]);
 dl('ledger-transactions-'+today()+'.csv',[H,...rows].map(r=>r.map(c=>/[",\n]/.test(c=String(c??''))?'"'+c.replace(/"/g,'""')+'"':c).join(',')).join('\n'),'text/csv')}
function dl(name,txt,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(s){const rows=[];let r=[],c='',q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
function pdate(x){x=(x||'').trim();let m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}
function importCSV(txt){const rows=parseCSV(txt);if(rows.length<2)return toast('That CSV has no rows');const h=rows[0].map(x=>x.trim().toLowerCase().replace(/\s+/g,'_')),ix=n=>h.indexOf(n);
 if(ix('date')<0||ix('amount')<0)return toast('CSV needs at least “date” and “amount” columns');
 let n=0,sk=0;
 const findAcc=nm=>S.accounts.find(x=>x.name.toLowerCase()===(nm||'').trim().toLowerCase());
 const getAcc=nm=>{nm=(nm||'Imported').trim()||'Imported';let a=findAcc(nm);if(!a){a={id:uid(),name:nm,type:'bank',open:0};S.accounts.push(a)}return a};
 const cardFor=(nm,hint)=>{const named=findAcc(nm);if(named?.type==='card')return named;const s=(String(nm||'')+' '+hint).toLowerCase();if(/sbi|gpay\s*flex/.test(s))return S.accounts.find(a=>a.type==='card'&&/sbi/i.test(a.name))||null;if(/hdfc|pixel/.test(s))return S.accounts.find(a=>a.type==='card'&&/hdfc/i.test(a.name))||null;return null};
 rows.slice(1).forEach(r=>{const g=k=>ix(k)>=0?(r[ix(k)]||'').trim():'',date=pdate(g('date')),raw=parseFloat(g('amount').replace(/[^0-9.\-]/g,''));if(!date||isNaN(raw)){sk++;return}
  const from=getAcc(g('account')),rawType=g('type').toLowerCase(),hint=[g('category'),g('payee'),g('note')].join(' ');let type=rawType,dest=null;
  if(type==='card payment'){type='transfer';dest=cardFor(g('to_account'),hint)}
  else if(type==='transfer'){dest=findAcc(g('to_account'))||getAcc(g('to_account'))}
  else if(!['income','expense'].includes(type)){const explicitTo=findAcc(g('to_account'));if(explicitTo){type='transfer';dest=explicitTo}else type=raw<0?'expense':'income'}
  if(type==='expense'&&from.type!=='card'&&/credit.?card.?payment|creditcardpayment|card.?payment/i.test(hint)){const inferred=cardFor(g('to_account'),hint);if(inferred){type='transfer';dest=inferred}}
  if(type==='transfer'&&(!dest||dest.id===from.id)){sk++;return}
  const t={id:uid(),date,type,amt:Math.abs(raw),acc:from.id,to:type==='transfer'?dest.id:'',cat:type==='transfer'?'':g('category'),payee:type==='transfer'?'':g('payee'),note:type==='transfer'&&dest.type==='card'?(g('note')||'Credit card payment recognized from statement'):g('note')};
  S.tx.push(t);n++});save();render();toast(`Imported ${n} transactions${sk?', skipped '+sk:''}`)}
function restore(txt){try{const d=migrate(JSON.parse(txt));ask(`Replace all data with this backup (${d.accounts.length} accounts, ${d.tx.length} transactions)?`,'Replace',()=>{S=d;ready=true;save();render();toast('Backup restored')})}catch(e){toast('That file isn’t a valid Ledger backup')}}
function dataView(){$('#main').innerHTML=`<div class="top"><h2>Import &amp; Backup</h2></div>
 <div class="card" style="margin-bottom:18px"><div class="row" style="padding-top:0"><div><h3 style="margin-bottom:3px">Your data file</h3><div class="mu">${driveMode?'Changes are encrypted and saved to Google Drive.':FH?'Changes save automatically to this file.':'Choose a file to save your changes.'}</div></div><span class="tag">${driveMode?'Encrypted Drive':FH?'Connected':'Not connected'}</span></div>
 <div class="row"><b>${esc(fname||'No file selected')}</b><span class="mu">${driveMode?(dirty?'Saving encrypted…':'Encrypted and saved') :FH?(dirty?'Saving…':'All changes saved'):'Your data stays in a file you choose'}</span></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="b p" onclick="saveFile()">${FH?'Save now':'Save to file…'}</button><button class="b" onclick="openFile()">Open data file…</button><button class="b" onclick="saveAs()">Save as…</button><button class="b" onclick="newFile()">New file…</button>${FH?'<button class="b d" onclick="forgetFile()">Forget location</button>':''}</div>
 </div>
 <div class="card" style="margin-bottom:18px"><h3>Google Drive · encrypted storage</h3><p class="mu">Sign in to connect Drive. Your tracker data is encrypted in this browser with your passphrase before it is uploaded. Google stores only the encrypted file. Keep your passphrase safe; it cannot be reset.</p>
 <div class="f"><div class="w"><label>Google OAuth client ID</label><input id="driveClientId" placeholder="123…apps.googleusercontent.com" value="${esc(prefGet('ledger_google_client_id')||'')}"></div><div class="w"><label>Encryption passphrase · at least 12 characters</label><input id="drivePass" type="password" autocomplete="new-password" placeholder="Needed to unlock your data"></div></div><label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0;color:var(--mu)"><input id="driveRemember" type="checkbox" style="width:auto;margin-top:3px" ${prefGet('ledger_remember_drive_key')==='1'?'checked':''}>Remember this device: save an encryption key in this browser so the Drive file can reopen after refresh. Use only on your private device.</label>
 <p style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><button class="b" onclick="saveDriveClient()">Save client ID</button><button class="b p" onclick="connectDrive()">${prefGet('ledger_drive_preferred')==='1'?'Reconnect Google Drive':'Connect Google Drive'}</button><button class="b" onclick="loadDriveData()">Load encrypted Drive file</button><button class="b" onclick="createDriveData()">Create encrypted Drive file from current data</button><button class="b" onclick="openDriveFile()">Find file in Drive</button><button class="b" onclick="forgetDriveFileLink()">Refresh Drive file link</button></p><div id="driveStatus" class="mu">${driveMode?'Using encrypted Google Drive file':driveToken?'Google Drive connected':'Not connected'}</div>
 <details style="margin-top:10px"><summary class="mu" style="cursor:pointer">Google setup required</summary><p class="mu">In Google Cloud, enable the Google Drive API, configure the OAuth consent screen, create a Web application OAuth client, and add this site’s exact origin to Authorized JavaScript origins. Paste its client ID above. Use HTTPS hosting or localhost; opening the HTML directly as file:// cannot sign in. Add the exact origin shown by this page. The app requests the limited drive.file permission for its own file.</p></details></div>
 <h3 style="margin:0 0 10px">Move data in or out</h3><div class="grid g2" style="margin-bottom:18px">
 <div class="card"><h3>Import transactions</h3><p class="mu">Choose a CSV file. Required columns: date and amount. Rows are added to your current data; importing a file twice can create duplicates.</p><input type="file" id="fcsv" accept=".csv,text/csv"><details style="margin-top:10px"><summary class="mu" style="cursor:pointer">CSV format details</summary><p class="mu">Optional columns: ${H.filter(x=>!['date','amount'].includes(x)).join(', ')}. Dates can be YYYY-MM-DD or DD/MM/YYYY. Unknown accounts are created automatically. Use type “card payment” and the card in to_account for card payments.</p></details></div>
 <div class="card"><h3>Backup or restore</h3><p class="mu">${driveMode?'Download a passphrase-protected copy, or import a previous Ledger backup.':'Save a full copy of your accounts and transactions, or restore from a previous Ledger backup.'}</p><button class="b p" onclick="${driveMode?'saveEncryptedCopy()':'dl(\'ledger-backup-\'+today()+\'.json\',JSON.stringify(S,null,1),\'application/json\')'}">${driveMode?'Download encrypted backup':'Download backup'}</button><p style="margin:14px 0 0"><label class="mu" for="fjson">Restore from a backup file</label><input type="file" id="fjson" accept=".json,application/json" style="margin-top:6px"></p></div>
 <div class="card"><h3>Export</h3><p class="mu">Download transactions for Numbers, Excel, or another spreadsheet app.</p><button class="b" onclick="csvOut()">Download CSV</button> <button class="b" onclick="xlsAll()">Download Excel</button></div>
 <div class="card"><h3>Appearance &amp; data</h3><div class="f"><div class="w"><label>Appearance</label><select id="th"><option value="">Match system</option><option>light</option><option>dark</option></select></div></div><p style="margin-bottom:0"><button class="b" onclick="sample()">Load sample data</button> <button class="b d" onclick="wipe()">Erase everything</button></p></div></div>`;
 const rd=(el,fn)=>el.onchange=()=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>fn(r.result);r.readAsText(f);el.value=''};
 rd($('#fcsv'),importCSV);rd($('#fjson'),restore);
